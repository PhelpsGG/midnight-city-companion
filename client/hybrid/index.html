<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight Companion · Hybrid sandbox</title><link rel="stylesheet" href="/style.css"><body>
<header><div><b>MIDNIGHT <span>COMPANION</span></b><small>HYBRID EXPERIENCE / CENTRAL</small></div><div class="badge">SANDBOX · NO LIVE CONNECTION</div></header>
<main id="world" aria-label="Native Midnight City world"></main><div id="loading" role="status">Loading cached native world…</div>
<nav class="world-tools" aria-label="World tools"><button id="follow">◎ Follow River</button><button id="explore">⌖ Explore</button><button id="reset">Reset rehearsal</button></nav>
<section id="activity" class="float"><button id="drag" aria-label="Move activity widget with arrow keys or drag">⠿ ACTIVITY & SESSION XP</button><div id="status" aria-live="polite"></div><div class="controls"><button id="start">Start rehearsal</button><button id="pause">Pause</button><button id="stop">Stop</button></div></section>
<aside id="cabinet"><div class="identity"><small>YOUR CHARACTER</small><h1>River</h1><p>Synthetic player · Central</p><div>♥ 100 / 100 <span>◈ <b id="crystals">0</b> crystals</span></div></div><nav id="tabs" role="tablist" aria-label="Character panels"></nav><section id="panel" role="tabpanel"></section></aside>
<section id="context" class="float" hidden><button id="close-context" aria-label="Close world detail">×</button><div id="context-body"></div></section>
<footer>Native Midnight City artwork & renderer · scripted interface rehearsal, not a game simulation · Drag the map to explore</footer><script type="module" src="/client.js"></script></body></html>
